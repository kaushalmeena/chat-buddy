<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Chat Buddy</title>
    <meta
      name="description"
      content="A private-by-default chat companion that runs its language model entirely in your browser."
    />
    <meta name="theme-color" content="#097974" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080e10" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script>
      // Resolve the theme before first paint so a dark-mode reload never flashes a
      // white canvas. Reads the zustand `persist` envelope directly, because the
      // app bundle has not loaded yet and this must be synchronous.
      (() => {
        try {
          const raw = localStorage.getItem("chat-buddy:settings");
          const state = raw ? JSON.parse(raw)?.state : undefined;
          const theme = state?.theme ?? "system";

          // A first visit is dealt an accent at random; the app persists it.
          // Keep this list in step with ACCENTS in src/stores/config.ts.
          const accents = ["teal", "blue", "green", "orange", "pink"];
          document.documentElement.dataset.accent = accents.includes(state?.accent)
            ? state.accent
            : accents[Math.floor(Math.random() * accents.length)];

          const dark =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          /* Storage unavailable, or a shape we don't recognise: light and teal stand. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        Chat Buddy needs JavaScript, because the language model runs on your own device.
      </p>
    </noscript>
  </body>
</html>
