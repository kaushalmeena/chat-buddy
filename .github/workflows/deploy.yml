name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run `verify` only. Nothing is published from a branch.
  pull_request:
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Deliberately not cancelling: a half-applied Pages deployment leaves the site in an
  # unknown state, and these runs are short enough that queueing costs little.
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Must run *before* the build, which is the opposite of the usual ordering: it
      # resolves the path the site will be served from, and the build bakes that into
      # asset URLs, the service worker's precache list and the worker's scope.
      - uses: actions/configure-pages@v5
        id: pages

      - env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Add SPA fallback
        # Pages has no rewrite rules, so a deep link 404s on a cold visit — before the
        # service worker exists to serve the shell. Using index.html as the 404 page
        # makes the first visit to any path work.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    # Only from main; a pull request stops after `verify`.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
